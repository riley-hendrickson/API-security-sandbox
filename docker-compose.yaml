services:

  audit-service:
    build: ./audit-service
    container_name: audit-service
    ports:
      - "8080:8080"

  backend-for-frontend:
    build: ./backend-for-frontend
    container_name: backend-for-frontend
    ports:
      - "8081:8081"
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8083
      DOCS_API_URL: http://docs-api:8082
      CSRF_ENABLED: "true"

  docs-api:
    build: ./docs-api
    container_name: docs-api
    ports:
      - "8082:8082"
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8083
      AUDIT_SERVICE_URL: http://audit-service:8080

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    ports:
      - "8083:8083"
    command: start-dev --http-port=8083 --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_HOSTNAME: http://localhost:8083
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

