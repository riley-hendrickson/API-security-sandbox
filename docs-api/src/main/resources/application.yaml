spring:
  application:
    name: docs-api
  datasource:
    url: jdbc:h2:mem:docs
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8083/realms/sandbox
          jwk-set-uri: http://keycloak:8083/realms/sandbox/protocol/openid-connect/certs
          audiences:
            - docs-api
app:
  keycloak:
    internal-url: ${KEYCLOAK_INTERNAL_URL:http://keycloak:8083}
  docs-api:
    client-secret: ${DOCS_API_SECRET:uRM4MOPrXrF1O2e4umRuCAYFCfyaecgBvoOjPrTW8bJPChVj2zhhuAYgGbQC1fs9qY79ajzh6XFxmMfhVlU6Na}
  audit:
    snapshot-rate-ms: 60000
server:
  port: 8082
